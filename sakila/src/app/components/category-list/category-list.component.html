<div class="container mt-5">
  <div class="row">
    <div class="col-12 col-md-6 col-lg-4" *ngFor="let category of categories">
      <div class="card">
        <img src="category-image.jpg" class="card-img-top" alt="Category Image">
        <div class="card-body">
          <h5 class="card-title">{{ category.name }}</h5>
          <button class="btn btn-primary" (click)="prepararEdicion(category)">Editar</button>
        </div>
      </div>
    </div>
  </div>
</div>
